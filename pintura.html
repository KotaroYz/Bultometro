<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bultómetro - Calcular Pintura</title>
    <link rel="stylesheet" href="css/calcular.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="header__back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Volver al Menú
        </a>
        <span class="header__title">Bultómetro</span>
        <div class="header__spacer"></div>
    </header>
    <main class="container">
        <section class="panel">
            <h1 class="panel__title">Parámetros de la Pintura</h1>
            <p class="panel__subtitle">Introduce la superficie total de los muros o cielorrasos a pintar</p>

            <form class="form" id="muroForm">
                <div class="form__group">
                    <label for="superficie">Superficie del muro (m²)</label>
                    <input type="number" id="superficie" name="superficie" step="0.01" min="0.1" value="40.0" required>
                </div>
                <button type="submit" class="btn-calcular">Calcular Materiales</button>
            </form>
        </section>
        <section class="panel">
            <h2 class="panel__title">Resultado del Cómputo</h2>
            <div class="resultado-total">
                <span class="resultado-total__label">Litros de pintura necesarios</span>
                <span class="resultado-total__value" id="superficieTotal">6.66 litros</span>
            </div>
        </section>

    </main>
</body>
</html>
