<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bultómetro - Calcular Pisos</title>
    <link rel="stylesheet" href="css/calcular.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="header__back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Volver al Menú
        </a>
        <span class="header__title">Bultómetro</span>
        <div class="header__spacer"></div>
    </header>
    <main class="container">
        <section class="panel">
            <h1 class="panel__title">Parámetros del Piso</h1>
            <p class="panel__subtitle">Especifica las dimensiones del área a revestir</p>

            <form class="form" id="muroForm">
                <div class="form__group">
                    <label for="ancho">Ancho (m)</label>
                    <input type="number" id="ancho" name="ancho" step="0.01" min="0.1" value="5.00" required>
                </div>

                <div class="form__group">
                    <label for="largo">Largo (m)</label>
                    <input type="number" id="largo" name="largo" step="0.01" min="0.1" value="6.00" required>
                </div>
                <button type="submit" class="btn-calcular">Calcular Materiales</button>
            </form>
        </section>
        <section class="panel">
            <h2 class="panel__title">Resultado del Cómputo</h2>
            <div class="resultado-total">
                <span class="resultado-total__label">Superficie con 10% extra por recortes</span>
                <span class="resultado-total__value" id="superficieTotal">3.3 m²</span>
            </div>
        </section>
    </main>
</body>
</html>
