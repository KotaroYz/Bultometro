<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bultómetro - Registro</title>
    <link rel="stylesheet" href="css/registro-login.css">
</head>
<body>

    <div class="card">
        <div class="card__icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 24 24" fill="none" stroke="#ff4d00" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-ruler"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/><path d="m17.5 15.5 2-2"/></svg>
                <path d="M3 21L21 3"/>
                <path d="M9 3H21V15"/>
            </svg>
        </div>
        <h1 class="card__title">Bultometro</h1>
        <p class="card__subtitle">Ingresa tus datos para acceder al panel</p>
        <form class="form">
            <div class="form__group">
                <label for="correo">Usuario</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@empresa.com" required>
            </div>
            <p class="olvido-contraseña"><a href="recuperar-usuario.html">¿La olvidaste?</a></p>
            <div class="form__group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••••••" required>
            </div>
            <button type="submit" class="btn-registrar" method="post" action="">Iniciar Sesión</button>
        </form>
        <p class="card__footer">
            ¿No tienes una cuenta? <a href="registro.html">Registrarse</a>
        </p>
    </div>

</body>
</html>
